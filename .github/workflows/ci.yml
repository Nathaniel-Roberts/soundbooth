name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo clippy -- -D warnings
      # hardware (microphone) tests gate behind SOUNDBOOTH_HW_TEST=1 and
      # skip themselves on CI
      - run: cargo test
