name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      # hardware (microphone) tests are gated behind SOUNDBOOTH_HW_TEST=1
      # and skip themselves on CI
      - run: go test ./...
